<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>划线翻译</title>
  <style>
    :root {
      --primary: #2f6bff;
      --primary-dark: #1f56d9;
      --text: #1f2329;
      --muted: #86909c;
      --border: #e5e6eb;
    }
    * { box-sizing: border-box; }
    body {
      width: 380px;
      margin: 0;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background: #fff;
    }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .head h1 {
      font-size: 16px;
      margin: 0;
    }
    .head a {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
    }
    .head a:hover { color: var(--primary); }
    .main { padding: 14px 16px; }
    textarea {
      width: 100%;
      min-height: 90px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.15);
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      padding: 7px 18px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button.primary {
      background: var(--primary);
      color: #fff;
    }
    button.primary:hover { background: var(--primary-dark); }
    button.primary:disabled { opacity: 0.55; cursor: not-allowed; }
    button.speak {
      padding: 3px 12px;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 12px;
    }
    button.speak:hover { border-color: var(--primary); color: var(--primary); }
    .status {
      font-size: 12px;
      color: var(--muted);
    }
    .result {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f7f8fa;
      display: none;
    }
    .result.show { display: block; }
    .result .res-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px dashed var(--border);
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }
    .result .res-body {
      padding: 10px 12px;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 220px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="head">
    <h1>划线翻译</h1>
    <a href="#" id="openOptions">设置</a>
  </div>
  <div class="main">
    <textarea id="input" placeholder="输入英文或中文，自动翻译为另一种语言…"></textarea>
    <div class="actions">
      <button type="button" class="primary" id="btnTranslate">翻译</button>
      <span class="status" id="status"></span>
    </div>
    <div class="result" id="result">
      <div class="res-head">
        <span class="lang-label" id="langLabel">译文</span>
        <span style="display:flex;gap:8px;">
          <button type="button" class="speak" id="btnCopy">复制</button>
          <button type="button" class="speak" id="btnSpeak">朗读</button>
        </span>
      </div>
      <div class="res-body" id="resultText"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
